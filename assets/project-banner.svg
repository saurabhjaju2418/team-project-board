<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Team Project Board</title><desc id="desc">A moving task card travels across a four-column project board.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101c35"/><stop offset="1" stop-color="#123c4c"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#050b17" flood-opacity=".35"/></filter></defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1040" cy="-20" r="240" fill="#34d399" opacity=".08"><animate attributeName="r" values="220;250;220" dur="8s" repeatCount="indefinite"/></circle>
  <text x="72" y="132" fill="#f8fafc" font-family="Arial,sans-serif" font-size="48" font-weight="700">Team Project Board</text>
  <text x="74" y="176" fill="#c3d4e7" font-family="Arial,sans-serif" font-size="20">A clear path from backlog to done.</text>
  <g transform="translate(670 70)" filter="url(#shadow)"><rect width="455" height="218" rx="18" fill="#f8fafc"/>
    <g font-family="Arial,sans-serif" font-size="12" font-weight="700"><text x="20" y="29" fill="#60738a">BACKLOG</text><text x="137" y="29" fill="#60738a">IN PROGRESS</text><text x="275" y="29" fill="#60738a">IN REVIEW</text><text x="386" y="29" fill="#60738a">DONE</text></g>
    <g fill="#eaf0f6"><rect x="16" y="42" width="96" height="152" rx="10"/><rect x="130" y="42" width="96" height="152" rx="10"/><rect x="244" y="42" width="96" height="152" rx="10"/><rect x="358" y="42" width="81" height="152" rx="10"/></g>
    <g><rect x="25" y="55" width="78" height="55" rx="8" fill="#fff" stroke="#dbe4ef"/><rect x="34" y="66" width="48" height="6" rx="3" fill="#a9b8ca"/><rect x="34" y="80" width="60" height="5" rx="2.5" fill="#d1dbe7"/>
      <g><rect x="145" y="58" width="68" height="59" rx="8" fill="#fff" stroke="#93c5fd"/><rect x="154" y="69" width="43" height="6" rx="3" fill="#2563eb"/><rect x="154" y="83" width="51" height="5" rx="2.5" fill="#d1dbe7"/><circle cx="202" cy="104" r="7" fill="#34d399"/><animateTransform attributeName="transform" type="translate" values="-118 0;0 0;0 0;118 0" keyTimes="0;.3;.7;1" dur="5s" repeatCount="indefinite"/></g>
      <rect x="258" y="55" width="68" height="55" rx="8" fill="#fff" stroke="#dbe4ef"/><rect x="267" y="66" width="39" height="6" rx="3" fill="#7c3aed"/><rect x="267" y="80" width="50" height="5" rx="2.5" fill="#d1dbe7"/><rect x="369" y="55" width="58" height="55" rx="8" fill="#fff" stroke="#dbe4ef"/><rect x="378" y="66" width="35" height="6" rx="3" fill="#10b981"/></g>
  </g>
</svg>

